<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LJIA Settings</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <div class="options-container">
    <h1>Live Japanese Immersion Assistant — Settings</h1>

    <label class="setting-row">
      <input type="checkbox" id="extension-enabled" />
      Enable extension
    </label>

    <label class="setting-row">
      <input type="checkbox" id="show-english" />
      Show English subtitle line
    </label>

    <p id="save-status"></p>
  </div>

  <script src="options.js"></script>
</body>
</html>
